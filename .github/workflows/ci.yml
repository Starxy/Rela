name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm run prepare:core
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run smoke:core
      - run: npm run test:credential
      - run: npm run test:release-tools
      - run: npm run tauri -- build --debug --no-bundle
      - run: npm run package:portable -- --debug
      - run: npm run tauri -- bundle --debug --no-sign --ci --bundles nsis
      - run: npm run check:packages -- --debug
      - run: powershell -NoProfile -File scripts/test-portable-cleanup.ps1
