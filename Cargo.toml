[workspace]
members = ["crates/rela-protocol", "crates/rela-manifests", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
rela-protocol = { path = "crates/rela-protocol" }
rela-manifests = { path = "crates/rela-manifests" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
